# librabot.com.ar no tiene /docs/ ni login, así que no usa la imagen libra-nginx-web del
# kit: esa trae un `proxy_pass` al contenedor de auth y nginx no arranca si el upstream no
# resuelve. Mismo criterio que librasuite_web.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
